version: '3.8'

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: org_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:admin123@db:5432/org_db
      SECRET_KEY: "ch@ng3-m3-in-production-super-secret-key-2024"
      DEBUG: "False"
      ALLOWED_HOSTS: "10.10.10.7,10.10.10.15,localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://10.10.10.7,http://10.10.10.15:8080"
      SITE_NAME: "Andijon viloyati SSV"
      SITE_ABBR: "AVSSV"
      SITE_DOMAIN: "10.10.10.15:8080"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: "http://10.10.10.15:8080/api/v1"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume:
