server {
    listen 80;
    server_name 10.10.10.7 localhost;
    client_max_body_size 100M;

    # Docker internal DNS resolver — upstreamni dinamik hal qiladi
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Django static files
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Django media files
    location /media/ {
        alias /media/;
        expires 7d;
    }

    # Django REST API
    location /api/ {
        set $be http://backend:8000;
        proxy_pass $be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Django admin panel
    location /admin/ {
        set $be http://backend:8000;
        proxy_pass $be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django qo'llanma (guide)
    location /qollanma/ {
        set $be http://backend:8000;
        proxy_pass $be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Nuxt SSR frontend — qolgan hamma so'rovlar
    location / {
        set $fe http://frontend:3000;
        proxy_pass $fe;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
